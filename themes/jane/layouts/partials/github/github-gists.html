<ul>
  {{ $gistUrl := "https://api.github.com/users/jygastaud/gists" }}
  {{ $gistRes := resources.GetRemote $gistUrl }}
  {{ if $gistRes }}
  {{ $gistJ := $gistRes.Content | transform.Unmarshal }}
  {{ range first 5 $gistJ }}
    {{ if .public }}
      <li><a href="{{ .html_url }}" target="_blank">{{ .description }}</a></li>
    {{ end }}
  {{ end }}
  {{ end }}
</ul>
